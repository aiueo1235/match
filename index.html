<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySync</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <header>
        <h1>StudySync</h1>
        <p class="sub-text">空きコマを合わせて課題を倒そう</p>
    </header>

    <div id="setup-screen" class="card">
        <h3>📅 自分の空きコマ</h3>
        <div class="grid" id="timetable-grid"></div>
        <h3>📝 残っている課題</h3>
        <input type="text" id="task-input" placeholder="例: レポート, 英語, 数学">
        <button class="btn-primary" id="generate-btn">共有用QRを表示</button>
    </div>

    <div id="qr-screen" class="card hidden">
        <h3>友達にスキャンさせてね</h3>
        <div id="qrcode"></div>
        <button class="btn-secondary" onclick="toggleScreen('setup-screen')">内容を編集する</button>
    </div>

    <div id="match-screen" class="card hidden">
        <div class="match-banner">🤝 マッチングしました！</div>
        <h3>📍 被っている空きコマ</h3>
        <div id="common-slots" class="result-box highlight-text"></div>
        <h3>🔥 一緒にできる課題</h3>
        <div id="common-tasks" class="result-box highlight-text" style="color: #eb4d4b;"></div>
        <h3>📔 相手の課題リスト</h3>
        <div id="friend-tasks" class="result-box"></div>
        <button class="btn-secondary" onclick="window.location.href=window.location.pathname">自分の画面に戻る</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
